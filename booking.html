<section class="py-5"><div class="container-fluid px-3 px-lg-5"><div class="form-card rounded-4 shadow-lg p-4 p-md-5 mx-auto"><h1 class="text-center fw-bold mb-2">Travel Booking Form</h1><p class="text-center text-muted mb-4">Fill in your details to submit a booking request.</p>
<form id="bookingForm">
<div class="row"><div class="col-12 col-md-6 mb-3"><label class="form-label">Full Name</label><input type="text" class="form-control" placeholder="Enter your name" required></div>
<div class="col-12 col-md-6 mb-3"><label class="form-label">Email</label><input type="email" class="form-control" placeholder="Enter email" required></div></div>
<div class="row"><div class="col-12 col-md-6 mb-3"><label class="form-label">Select Destination</label><select id="destination" class="form-select" required><option value="">Choose destination</option><option>Goa</option><option>Manali</option><option>Kerala</option><option>Jaipur</option><option>Agra</option></select></div>
<div class="col-12 col-md-6 mb-3"><label class="form-label">Travel Date</label><input type="date" class="form-control" required></div></div>
<div class="mb-3"><label class="form-label">Number of People</label><input type="number" min="1" class="form-control" placeholder="Enter number of people" required></div>
<div class="mb-3"><label class="form-label">Message</label><textarea class="form-control" rows="4" placeholder="Any special request?"></textarea></div>
<button type="submit" class="btn btn-success w-100">Submit Booking Request</button>
</form><div id="bookingMessage" class="alert alert-success mt-4 d-none">Booking request submitted successfully!</div>
</div></div></section><footer class="bg-dark text-white text-center py-3 mt-5"><p class="mb-0">© 2026 ChaloChale Travel App | Designed with Bootstrap</p></footer>
